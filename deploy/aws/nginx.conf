# Copy to /etc/nginx/sites-available/studytrack and replace the example hostname.
# Certbot can add HTTPS and the HTTP-to-HTTPS redirect after DNS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name study.example.com;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # StudyTrack only trusts this header when PORT is set; Nginx overwrites it.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
